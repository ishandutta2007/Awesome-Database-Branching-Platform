<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { r: 6px; opacity: 0.4; }
      50% { r: 10px; opacity: 1; }
      100% { r: 6px; opacity: 0.4; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-node { animation: pulse 3s infinite ease-in-out; }
    .flowing-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Outer Border -->
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.6"/>

  <!-- Dynamic Animated Background Elements (Branches & Nodes in background) -->
  <g opacity="0.25">
    <!-- Main Trunk -->
    <path d="M 100 160 H 1100" stroke="#6366f1" stroke-width="3"/>
    
    <!-- Branch Lines -->
    <path d="M 250 160 C 350 160, 400 70, 550 70 H 1050" fill="none" stroke="#a855f7" stroke-width="3" class="flowing-line"/>
    <path d="M 450 160 C 550 160, 600 250, 750 250 H 1050" fill="none" stroke="#ec4899" stroke-width="3" class="flowing-line"/>
    <path d="M 650 70 C 720 70, 760 120, 850 120 H 1050" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-line"/>

    <!-- Nodes -->
    <circle cx="250" cy="160" r="7" fill="#6366f1" class="pulsing-node"/>
    <circle cx="450" cy="160" r="7" fill="#6366f1" class="pulsing-node"/>
    <circle cx="550" cy="70" r="7" fill="#a855f7" class="pulsing-node"/>
    <circle cx="650" cy="70" r="7" fill="#a855f7" class="pulsing-node"/>
    <circle cx="750" cy="250" r="7" fill="#ec4899" class="pulsing-node"/>
    <circle cx="850" cy="120" r="7" fill="#38bdf8" class="pulsing-node"/>
  </g>

  <!-- Foreground Content Card (Ensures Title & Subtitle match exact contrast & visibility) -->
  <rect x="60" y="45" width="1080" height="230" rx="12" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>

  <!-- Header Category Pill -->
  <rect x="90" y="75" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105" y="96" class="badge-text">⚡ AWESOME ECOSYSTEM</text>

  <!-- Title & Subtitle -->
  <text x="90" y="155" class="title" filter="url(#glow)">Awesome Database Branching</text>
  <text x="90" y="195" class="subtitle">Curated Copy-on-Write Database Branching Platforms & Developer Tools</text>

  <!-- Tech Badges / Tags -->
  <g transform="translate(90, 220)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#312e81"/><text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">PostgreSQL</text>
    <rect x="140" y="0" width="110" height="28" rx="6" fill="#831843"/><text x="152" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">Copy-on-Write</text>
    <rect x="260" y="0" width="130" height="28" rx="6" fill="#064e3b"/><text x="272" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Database CI/CD</text>
    <rect x="400" y="0" width="120" height="28" rx="6" fill="#1e3a8a"/><text x="412" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Open-Source</text>
  </g>
</svg>
