<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="line-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="line-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-elem { animation: pulse 4s infinite ease-in-out; }
    .flowing-line { stroke-dasharray: 8 8; animation: dash 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Outer Border -->
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.6"/>

  <!-- Dynamic Animated Background Elements (Branches & Nodes in background) -->
  <g opacity="0.35">
    <!-- Main Trunk -->
    <path d="M 50 160 H 1150" stroke="#475569" stroke-width="2"/>
    
    <!-- Branch Lines -->
    <path d="M 200 160 C 320 160, 380 65, 520 65 H 1150" fill="none" stroke="url(#line-grad1)" stroke-width="3" class="flowing-line"/>
    <path d="M 400 160 C 500 160, 560 255, 700 255 H 1150" fill="none" stroke="url(#line-grad2)" stroke-width="3" class="flowing-line"/>
    <path d="M 600 65 C 680 65, 730 115, 820 115 H 1150" fill="none" stroke="#38bdf8" stroke-width="2" class="flowing-line"/>

    <!-- Nodes (Static SVGs for max compatibility) -->
    <circle cx="200" cy="160" r="8" fill="#6366f1"/>
    <circle cx="400" cy="160" r="8" fill="#6366f1"/>
    <circle cx="520" cy="65" r="8" fill="#a855f7"/>
    <circle cx="600" cy="65" r="8" fill="#a855f7"/>
    <circle cx="700" cy="255" r="8" fill="#ec4899"/>
    <circle cx="820" cy="115" r="8" fill="#38bdf8"/>
  </g>

  <!-- Foreground Content Card (Ensures Title & Subtitle match exact contrast & visibility) -->
  <rect x="60" y="45" width="1080" height="230" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>

  <!-- Header Category Pill -->
  <g>
    <rect x="90" y="75" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="96" class="badge-text">⚡ AWESOME ECOSYSTEM</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="90" y="155" class="title">Awesome Database Branching</text>
  <text x="90" y="195" class="subtitle">Curated Copy-on-Write Database Branching Platforms &amp; Developer Tools</text>

  <!-- Tech Badges / Tags -->
  <g transform="translate(90, 220)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#312e81"/><text x="14" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">PostgreSQL</text>
    <rect x="140" y="0" width="120" height="28" rx="6" fill="#831843"/><text x="154" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">Copy-on-Write</text>
    <rect x="270" y="0" width="130" height="28" rx="6" fill="#064e3b"/><text x="284" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Database CI/CD</text>
    <rect x="410" y="0" width="120" height="28" rx="6" fill="#1e3a8a"/><text x="424" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Open-Source</text>
  </g>
</svg>
